<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Joomla!'s API application is reachable two ways: as api/index.php, which works on any server, and as a bare
    # api/ path, which only works where URL rewriting is in effect. Autodetect tries both, so both have to exist here.
    <Directory /var/www/html/api>
        FallbackResource /api/index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
